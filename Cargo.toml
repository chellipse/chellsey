[package]
name = "chells-c-compiler"
version = "0.1.0"
edition = "2024"

[dependencies]
annotate-snippets = { version = "0.12.16", features = ["simd"] }
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
constcat = "0.6.1"
elsa = { version = "1.11.2", features = ["indexmap"] }
libc = "0.2.186"
object = { version = "0.37", default-features = false, features = ["write"] }
strum = "0.28.0"
strum_macros = "0.28.0"

[dev-dependencies]
insta = "1.48.0"
